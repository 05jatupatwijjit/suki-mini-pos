<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Suki Mini POS</title>
<style>
  :root {
    --bg: #ffffff;
    --ink: #1f2328;
    --muted: #5b636d;
    --line: #d9dde2;
    --soft: #f4f5f7;
    --blood: #9a1b22;
    --accent: #b3261e;
    --accent-ink: #ffffff;
    --warn-bg: #fff4d6;
    --warn-ink: #5c4300;
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Sarabun", "Noto Sans Thai", "Leelawadee UI", Tahoma, system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 18px;
    line-height: 1.5;
  }
  .app { max-width: 640px; margin: 0 auto; padding: 16px 16px 40px; }
  header { text-align: center; }
  header h1 {
    margin: 0 0 4px;
    font-size: clamp(1.8rem, 1.4rem + 2vw, 2.6rem);
    line-height: 1.2;
    color: var(--blood);
  }
  header p { margin: 0 0 clamp(16px, 3vw, 28px); color: var(--muted); font-size: 0.95rem; }

  .notice {
    background: var(--warn-bg);
    color: var(--warn-ink);
    border: 1px solid #e6c765;
    border-radius: 8px;
    padding: 10px 12px;
    margin-bottom: 12px;
    font-size: 0.95rem;
  }
  .notice[hidden] { display: none; }

  .layout { display: grid; gap: clamp(28px, 5vw, 56px); grid-template-columns: 1fr; }
  h2 { font-size: 1.15rem; margin: 0 0 10px; }

  .menu-list, .receipt-list { list-style: none; margin: 0; padding: 0; }
  .menu-item {
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: center;
    gap: 8px 12px;
    padding: 14px 0;
    border-bottom: 1px solid var(--line);
  }
  .menu-item:first-child { border-top: 1px solid var(--line); }
  .item-name { font-weight: 700; font-size: 1.1rem; }
  .item-price { color: var(--muted); font-size: 0.95rem; }
  .stepper { display: flex; align-items: center; gap: 6px; }
  .stepper button {
    width: 48px; height: 48px;
    font-size: 1.5rem; line-height: 1;
    border: 1.5px solid var(--ink);
    background: var(--bg);
    color: var(--ink);
    border-radius: 8px;
    cursor: pointer;
    touch-action: manipulation;
  }
  .stepper button.plus { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .stepper button:active { transform: scale(0.96); }
  .qty { min-width: 2.2ch; text-align: center; font-size: 1.25rem; font-weight: 700; font-variant-numeric: tabular-nums; }

  button:focus-visible { outline: 3px solid #1a5fd0; outline-offset: 2px; }

  .receipt-panel { border: 1.5px solid var(--ink); border-radius: 8px; padding: 16px; background: var(--bg); }
  .empty { color: var(--muted); padding: 12px 0; margin: 0; }
  .receipt-row {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 0 12px;
    padding: 8px 0;
    border-bottom: 1px dashed var(--line);
  }
  .receipt-row .line-name { font-weight: 700; }
  .receipt-row .line-detail { color: var(--muted); font-size: 0.9rem; }
  .receipt-row .line-total { font-weight: 700; font-variant-numeric: tabular-nums; align-self: center; }
  .total {
    display: flex; justify-content: space-between; align-items: baseline;
    border-top: 2px solid var(--ink);
    margin-top: 10px; padding-top: 10px;
    font-size: 1.3rem; font-weight: 700;
  }
  .total output { font-variant-numeric: tabular-nums; }

  .clear-btn {
    width: 100%; margin-top: 14px; min-height: 48px;
    font: inherit; font-weight: 700;
    border: 1.5px solid var(--accent);
    color: var(--accent-ink);
    background: var(--accent);
    border-radius: 8px; cursor: pointer;
    touch-action: manipulation;
  }
  .clear-btn:disabled { background: var(--bg); border-color: var(--line); color: #8a9099; cursor: not-allowed; }

  dialog {
    border: 1.5px solid var(--ink); border-radius: 10px;
    padding: 20px; max-width: min(92vw, 380px);
    color: var(--ink); background: var(--bg);
    font: inherit;
  }
  dialog::backdrop { background: rgba(0, 0, 0, 0.45); }
  dialog h3 { margin: 0 0 6px; font-size: 1.15rem; }
  dialog p { margin: 0 0 16px; color: var(--muted); }
  .dialog-actions { display: flex; gap: 10px; }
  .dialog-actions button {
    flex: 1; min-height: 48px; font: inherit; font-weight: 700;
    border-radius: 8px; cursor: pointer; border: 1.5px solid var(--ink);
    background: var(--bg); color: var(--ink);
  }
  .dialog-actions .confirm { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Suki Mini POS</h1>
    <p>แตะ + เพื่อเพิ่มรายการเข้าตะกร้า</p>
  </header>

  <div id="notice" class="notice" role="status" hidden></div>

  <div class="layout">
    <section aria-labelledby="menu-title">
      <h2 id="menu-title">เมนู</h2>
      <ul class="menu-list" id="menu-list"></ul>
    </section>

    <section class="receipt-panel" aria-labelledby="cart-title">
      <h2 id="cart-title">ตะกร้า</h2>
      <p class="empty" id="empty-msg">ยังไม่มีรายการ</p>
      <ul class="receipt-list" id="receipt-list"></ul>
      <div class="total">
        <span>ยอดรวม</span>
        <output id="total" aria-live="polite">0 บาท</output>
      </div>
      <button type="button" class="clear-btn" id="clear-btn" disabled>ล้างตะกร้า</button>
    </section>
  </div>
</div>

<dialog id="confirm-dialog" aria-labelledby="confirm-title">
  <h3 id="confirm-title">ล้างตะกร้า?</h3>
  <p>รายการทั้งหมดในตะกร้าจะถูกลบ</p>
  <div class="dialog-actions">
    <button type="button" id="cancel-clear">ยกเลิก</button>
    <button type="button" class="confirm" id="confirm-clear">ยืนยันการล้างตะกร้า</button>
  </div>
</dialog>

<script>
(function () {
  "use strict";

  var STORAGE_KEY = "sukiMiniPos.cart.v1";
  var MENU = [
    { id: "pork", name: "ชุดหมู", price: 199 },
    { id: "beef", name: "ชุดเนื้อ", price: 249 },
    { id: "water", name: "น้ำดื่ม", price: 20 }
  ];

  var cart = {};
  MENU.forEach(function (m) { cart[m.id] = 0; });

  var notices = { load: "", save: "" };

  var $menu = document.getElementById("menu-list");
  var $receipt = document.getElementById("receipt-list");
  var $empty = document.getElementById("empty-msg");
  var $total = document.getElementById("total");
  var $clear = document.getElementById("clear-btn");
  var $notice = document.getElementById("notice");
  var $dialog = document.getElementById("confirm-dialog");

  function fmt(n) { return n.toLocaleString("th-TH"); }

  /* ---------- Storage ---------- */
  function load() {
    var raw;
    try {
      raw = window.localStorage.getItem(STORAGE_KEY);
    } catch (e) {
      // Storage unavailable: app still works, saving will report its own notice.
      return;
    }
    if (raw === null) return;
    try {
      var data = JSON.parse(raw);
      if (!data || typeof data !== "object" || Array.isArray(data)) throw new Error("bad shape");
      MENU.forEach(function (m) {
        var v = data[m.id];
        if (v === undefined) return;
        if (typeof v !== "number" || !isFinite(v) || v < 0 || Math.floor(v) !== v) throw new Error("bad qty");
        cart[m.id] = v;
      });
    } catch (e) {
      MENU.forEach(function (m) { cart[m.id] = 0; });
      notices.load = "อ่านข้อมูลตะกร้าที่บันทึกไว้ไม่ได้ เริ่มจากตะกร้าว่าง";
    }
  }

  function save() {
    try {
      window.localStorage.setItem(STORAGE_KEY, JSON.stringify(cart));
      notices.save = "";
    } catch (e) {
      notices.save = "ไม่สามารถบันทึกตะกร้าได้ ข้อมูลจะหายเมื่อรีเฟรชหน้าเว็บ";
    }
  }

  function clearStorage() {
    try {
      window.localStorage.removeItem(STORAGE_KEY);
      notices.save = "";
    } catch (e) {
      notices.save = "ไม่สามารถบันทึกตะกร้าได้ ข้อมูลจะหายเมื่อรีเฟรชหน้าเว็บ";
    }
  }

  /* ---------- Rendering ---------- */
  function buildMenu() {
    MENU.forEach(function (m) {
      var li = document.createElement("li");
      li.className = "menu-item";
      li.innerHTML =
        '<div><div class="item-name"></div><div class="item-price"></div></div>' +
        '<div class="stepper">' +
          '<button type="button" class="minus" aria-label="ลด"></button>' +
          '<span class="qty" aria-live="polite">0</span>' +
          '<button type="button" class="plus" aria-label="เพิ่ม"></button>' +
        '</div>';
      li.querySelector(".item-name").textContent = m.name;
      li.querySelector(".item-price").textContent = fmt(m.price) + " บาท";
      var minus = li.querySelector(".minus");
      var plus = li.querySelector(".plus");
      minus.textContent = "\u2212";
      plus.textContent = "+";
      minus.setAttribute("aria-label", "ลด" + m.name);
      plus.setAttribute("aria-label", "เพิ่ม" + m.name);
      minus.addEventListener("click", function () { change(m.id, -1); });
      plus.addEventListener("click", function () { change(m.id, 1); });
      li.dataset.id = m.id;
      $menu.appendChild(li);
    });
  }

  function render() {
    var total = 0;
    var count = 0;
    $receipt.innerHTML = "";

    MENU.forEach(function (m) {
      var q = cart[m.id];
      var row = $menu.querySelector('[data-id="' + m.id + '"]');
      row.querySelector(".qty").textContent = q;

      if (q > 0) {
        var line = m.price * q;
        total += line;
        count += 1;
        var li = document.createElement("li");
        li.className = "receipt-row";
        var left = document.createElement("div");
        var n = document.createElement("div");
        n.className = "line-name";
        n.textContent = m.name + " x" + q;
        var d = document.createElement("div");
        d.className = "line-detail";
        d.textContent = fmt(m.price) + " บาท x " + q;
        left.appendChild(n);
        left.appendChild(d);
        var t = document.createElement("div");
        t.className = "line-total";
        t.textContent = fmt(line);
        li.appendChild(left);
        li.appendChild(t);
        $receipt.appendChild(li);
      }
    });

    $empty.hidden = count > 0;
    $total.textContent = fmt(total) + " บาท";
    $clear.disabled = count === 0;

    var msgs = [notices.load, notices.save].filter(Boolean);
    $notice.hidden = msgs.length === 0;
    $notice.textContent = msgs.join(" / ");
  }

  /* ---------- Actions ---------- */
  function change(id, delta) {
    var next = cart[id] + delta;
    if (next < 0) next = 0;
    if (next === cart[id]) return;
    cart[id] = next;
    save();
    render();
  }

  function openConfirm() {
    if ($dialog.showModal) {
      $dialog.showModal();
    } else {
      // Fallback for browsers without <dialog>
      if (window.confirm("ล้างตะกร้า? รายการทั้งหมดในตะกร้าจะถูกลบ")) doClear();
    }
  }

  function doClear() {
    MENU.forEach(function (m) { cart[m.id] = 0; });
    clearStorage();
    render();
  }

  $clear.addEventListener("click", openConfirm);
  document.getElementById("cancel-clear").addEventListener("click", function () { $dialog.close(); });
  document.getElementById("confirm-clear").addEventListener("click", function () {
    $dialog.close();
    doClear();
  });

  /* ---------- Init ---------- */
  buildMenu();
  load();
  render();
})();
</script>
</body>
</html>
